# CampusConnect — full stack (MySQL + Spring Boot API + nginx/React SPA)
#
# Quick start:
#   1) cp .env.example .env      # then edit secrets in .env
#   2) docker compose up --build
#   3) open http://localhost:${FRONTEND_PORT:-8081}
#
# Secrets (DB password, JWT secret) are read from .env — never hardcoded here.
# The ":?" guards fail fast with a helpful message if .env is missing.

name: campusconnect

services:
  # ----------------------------- Database -----------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusconnect}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:tharun1437}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campusconnect

  # --------------------------- Backend API ----------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      # Point the app at the mysql service on the compose network.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campusconnect}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:tharun1437}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      # Security-critical — must be provided via .env (min 32 bytes / base64).
      JWT_SECRET: BcQraUHV/s+MQZolSUk+iGBXqNx8uqz3R8R3rSZyTC5DeJlBU4rawIlM2NUY4XoVI+aE8TmehceKJ5F3NVUuug==
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # Browser origin(s) allowed to call the API directly.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173,http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8081}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      # Mail is optional; when disabled the app logs notifications instead of sending.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@campusconnect.local}
      # Payment gateway abstraction — credentials (if any) come from env, never code.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-INR}
      # AI is interface-only until a key is supplied.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      # Exposed so you can reach Swagger UI directly at http://localhost:8080/swagger-ui.html
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - campusconnect

  # ------------------------- Frontend (SPA) ---------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin defaults; nginx proxies these to the backend service.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - campusconnect

volumes:
  mysql-data:
    driver: local

networks:
  campusconnect:
    driver: bridge
